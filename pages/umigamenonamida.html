            <h2>おみやげグランプリ</h2>
            <p>四国八十八ヶ所をテーマにしたロゴデザイン・パッケージを展開。<br>
                遍路道に認定されている八十八ヶ所のお寺のイメージカラーや屋根の形など<br>
                特徴を掴んだロゴデザインを制作しました。<br>
                並べた時にカラーチャートのような色の連続性が感じられるようにパッケージ<br>
                の色味を３色縛りにし色の配置も統一しております。</p>
